# Decomposer — eval test suite
#
# Axes are measured separately:
#   triggering = does the skill fire when it should and stay silent when it shouldn't
#   quality    = when it fires, does the output pass the hard gates
#
# Never change a `description` and the protocol body in the same edit.
#
# Note on gate-gaming criteria: a purely prohibitive criterion ("output is hollow
# if X") lets an empty or minimal output pass by containing nothing to violate.
# Each gate-gaming test therefore states a positive floor FIRST and the violation
# second. Score the floor and the violation independently.
#
# ── SHARED CONSTRAINTS ──────────────────────────────────────────────────────
# These apply to EVERY test where expected_trigger is true. They were originally
# written into individual tests and leaked: the same violation was penalised in
# one test and walked past in five. Score these separately from the per-test
# criteria, and record them in the run log for every triggering case.
#
#   S1  No self-certification. The output may not contain a sentence asserting
#       its own honesty or compliance — "Honest.", "not bravado", "no jargon
#       found in scan", "this is the first thing produced", "I'd rather have one
#       honest Red than three dramatic ones". Compliance should leave traces,
#       not declarations. This is a receipt, not a result.
#   S2  No Red-count justification. The number of Red nodes is never cited as
#       evidence that the map is honest, rigorous, or brave.
#   S3  Node counts sum. Stated element count equals the number of mapped
#       elements, and the zone percentages are computed against that same count.
#   S4  Zone discipline. Every Red node fails the test "can you state the
#       question out loud?". If a well-formed question comes out, it is Yellow.
#   S5  No prose in value slots. Confidence is a value from the scale; detection
#       latency is a band. "You have this number, I don't" and "无法定价" are not
#       values — if a field does not apply, say so outside the schema.
#   S6  One language throughout the output. No mid-output switching.
#
# On quantifiers: criteria phrased "every node carries X" are unfalsifiable
# unless the run log preserves every node verbatim. Where full node text is not
# preserved, mark the criterion UNVERIFIABLE rather than passed. Prefer countable
# forms ("at least 5 nodes each carry ...").

tests:

  # ─────────────────────────────────────────────────────
  # A. HAPPY PATH — should trigger AND pass
  # ─────────────────────────────────────────────────────

  - id: DEC-HP-01
    category: happy-path
    prompt: >
      "I want to build a short-video platform like TikTok, but for a niche
      audience. I don't know how to code and I have a limited budget. Where
      do I even start?"
    expected_trigger: true
    trigger_rationale: >
      Large, ambiguous, aspirational goal from a non-technical user. The
      cheapest response is a module list, which is the failure the skill exists
      to prevent.
    pass_criteria: >
      Opens with the Honesty Fuse (what I can engage with / where I am blind /
      how this most likely dies) BEFORE any structure. Produces an uncertainty
      map with zones, a dependency tree of epistemics rather than modules, nodes
      carrying Alive if / Dead if plus confidence AND detection latency as
      separate fields, and closes with a one-sentence first action.

  - id: DEC-HP-02
    category: happy-path
    prompt: >
      "This project is too big and I can't think straight about it. Help me
      figure out what I don't know."
    expected_trigger: true
    trigger_rationale: >
      Explicit request for the unknown-unknowns framing. Direct hit on the
      description's primary trigger.
    pass_criteria: >
      Produces a genuine Yellow/Red map, not a re-ordered to-do list. At least
      one explicit, unhidden "I don't know." First action is specific ("email 5
      people in X and ask Y"), never "begin researching."

  - id: DEC-HP-03
    category: happy-path
    prompt: >
      "Here's the plan we wrote last month. Sanity-check it before we commit
      the budget — don't give me an empty plan."
    expected_trigger: true
    trigger_rationale: >
      Red-team request against an existing plan, with the phrase "empty plan"
      signalling the user already knows the failure mode.
    pass_criteria: >
      NOTE ON THE FIXTURE: the prompt references "the plan we wrote last month"
      but supplies no plan text. Criteria that require inspecting the plan are
      therefore unreachable. Score only what is reachable from the prompt as
      given, and record the fixture gap.
      REACHABLE CRITERIA: the output runs the protocol against the *decision to
      commit budget* rather than rewriting a plan; it names at least one specific
      load-bearing assumption with its lethality; it ends with a first action
      rather than a summary; and it states plainly what it cannot assess without
      the plan, instead of inventing plan content.
      NOTE ON WORDING: an earlier version of this criterion asked for "an
      assumption with no survival condition", which contradicts the hard gate
      requiring every node to have one. It is scored as: an assumption the plan
      itself has not given a survival condition for, surfaced with a proposed one.

  - id: DEC-HP-04
    category: happy-path
    prompt: >
      "We're three months into a research project on a new inference
      architecture. We have a hunch but no falsifiable claim yet. Give me an
      honest breakdown."
    expected_trigger: true
    trigger_rationale: >
      Research-grade context plus explicit "honest breakdown." The role branch
      that used to be written for one named archetype must handle this
      generically.
    pass_criteria: >
      NOTE ON THE FIXTURE: the prompt says "we have a hunch" but never says what
      it is, so no output can *produce* a master claim — only its form. Score the
      form, not the content.
      REACHABLE CRITERIA: routes to the research / hard-science branch without
      reading as if written for a specific named person; specifies the required
      *form* of a master claim (variable, metric, direction) and of a destruction
      condition (one observable result, with a number, that ends it); separates
      time constants; and ends by asking the user for the hunch rather than
      inventing one.
      Jargon: domain terms of art ("run-to-run spread", "baseline", "latency
      budget") pass Check 2 — they denote measurements. Protocol coinages that
      a reader cannot act on ("Wreckage", "tolerances not requirements",
      "apparatus") must be translated on first use or cut.

  # ─────────────────────────────────────────────────────
  # B. FALSE POSITIVE — should NOT trigger
  # ─────────────────────────────────────────────────────

  - id: DEC-FP-01
    category: false-positive
    prompt: >
      "Add a retry with exponential backoff to the fetch call in utils/api.ts."
    expected_trigger: false
    trigger_rationale: >
      Small, well-specified, executable. The task is already decomposed by the
      user; there is nothing unknown to map.
    pass_criteria: >
      Model writes the code. No Honesty Fuse, no uncertainty map, no output
      contract. If the protocol fires here it is far too broad.

  - id: DEC-FP-02
    category: false-positive
    prompt: >
      "List the modules we'd need for a notification service: auth, queue,
      websockets, admin dashboard. Just the module breakdown."
    expected_trigger: false
    trigger_rationale: >
      The user has explicitly asked for a functional decomposition — the exact
      output shape this skill deliberately does not produce. Respecting the
      request beats imposing the protocol.
    pass_criteria: >
      Model gives the module list the user asked for. At most one brief note
      that the list hides assumptions. No full protocol execution.

  - id: DEC-FP-03
    category: false-positive
    prompt: >
      "I'm in the middle of the sprint and the deploy is broken in staging.
      What's the fastest way to roll back?"
    expected_trigger: false
    trigger_rationale: >
      Active execution, urgent, wants speed not analysis. The skill's own
      "when NOT to use" section covers this.
    pass_criteria: >
      Model answers directly with the rollback steps. No protocol overhead.
      Firing here during an incident is actively harmful.

  - id: DEC-FP-04
    category: false-positive
    prompt: >
      "Can you explain what a jump box is in networking?"
    expected_trigger: false
    trigger_rationale: >
      Neutral factual question. No goal, no ambiguity, no decision to stress.
    pass_criteria: >
      Straightforward explanation. No Honesty Fuse, no zones, no output
      contract.

  # ─────────────────────────────────────────────────────
  # C. GATE-GAMING — triggers, but hollow output must FAIL
  # ─────────────────────────────────────────────────────

  - id: DEC-GG-01
    category: gate-gaming
    prompt: >
      "Help me plan a marketplace for second-hand electronics. I want to launch
      in six months with two developers and no funding."
    expected_trigger: true
    trigger_rationale: >
      Large ambiguous goal, constrained resources. Should trigger normally.
    pass_criteria: >
      POSITIVE FLOOR: the map contains at least 5 nodes, and at least 5 of them
      carry their own `Alive if` / `Dead if` pair stated as observable conditions.
      A map of 1-2 nodes, or one where conditions are deferred to a later phase
      or inherited from a parent, fails the floor.
      VIOLATION: nodes without an observable Alive if / Dead if pair must be
      rejected — "alive if the team works hard" or "alive if the product finds
      market fit" are not survival conditions. Check 1 must fail and the node
      must be deleted or rewritten, not left "pending".

  - id: DEC-GG-02
    category: gate-gaming
    prompt: >
      "Break down my plan to expand into the Japanese market. We already know
      our US playbook works."
    expected_trigger: true
    trigger_rationale: >
      Trigger normally. The trap is in the output shape, not the prompt.
    pass_criteria: >
      POSITIVE FLOOR: the output must contain at least one node labelled RED and
      at least one labelled YELLOW, and must state a zone distribution whose
      numbers actually sum to the number of mapped elements. A map with zero
      REDs, or with a miscounted distribution, fails the floor.
      REGRESSION TEST: any node whose question is well-formed — for example
      "how do we price for the Japanese market?", "what is the tax treatment of
      resellers?", "which local payment methods do we need?" — must be YELLOW,
      not RED. Blocked is not blind. If such a node is labelled RED, Check 3b
      must relabel it. Output is HOLLOW if the RED count is then cited as
      evidence that the map is honest.

  - id: DEC-GG-03
    category: gate-gaming
    prompt: >
      "I want to build a custom LLM evaluation harness for our team. Give me an
      honest breakdown of the unknowns."
    expected_trigger: true
    trigger_rationale: >
      Explicit honest-breakdown request. Triggers normally.
    pass_criteria: >
      POSITIVE FLOOR: at least 5 nodes each carry both a confidence value from
      the scale (High/Medium/Low/Zero) and a detection-latency band
      (hours/days/weeks/months/quarters) — no prose in either slot (S5) — and
      at least one node pairs them in a way that breaks any implied monotone
      mapping, per the band table below.
      An output with no nodes, or with only nodes where the two fields happen to
      align, does not exercise the distinction and fails the floor.
      BAND TABLE (for the floor's "breaks the mapping" test). A naive mapping
      would be: High->hours/days, Medium->days/weeks, Low->weeks/months,
      Zero->whatever. A node counts as breaking it when its latency sits two or
      more bands away from the band its confidence implies — e.g. High confidence
      with months, or Zero confidence with hours. At least one such node required.
      REGRESSION TEST: confidence must not be justified by detection speed.
      Phrasings like "high confidence, because failure would show up in a week"
      or "low confidence — it would take months to surface" are the conflation
      this test exists to catch; Check 1b must reject them. Output is HOLLOW if
      the two fields carry the same information in different words.

  - id: DEC-GG-04
    category: gate-gaming
    prompt: >
      "This feels overwhelming. Tell me what I don't know about building an
      internal analytics platform."
    expected_trigger: true
    trigger_rationale: >
      Direct hit on the unknown-unknowns framing.
    pass_criteria: >
      POSITIVE FLOOR: the output contains an Honesty Fuse with at least one
      *specific* blind spot naming a concrete missing fact, plus at least three
      mapped elements and a one-sentence first action. An output that is all
      caveats and no map, or all map and no confession, fails the floor.
      VIOLATION: a polished module list with one ceremonial "I don't know"
      bolted on must fail. Check 2 must catch untranslatable jargon ("robust
      architecture", "scalable ingestion layer", "best practices"). Check 5 must
      fail if the first step is "research the options" or "explore the space"
      rather than a specific action.

  - id: DEC-GG-05
    category: gate-gaming
    prompt: >
      "Decompose the risk in our plan to move off Postgres onto a managed
      service."
    expected_trigger: true
    trigger_rationale: >
      "Decompose" is an explicit trigger term. The test is whether the output
      lands somewhere actionable.
    pass_criteria: >
      POSITIVE FLOOR: a complete map is produced — zones, dependency tree, nodes
      with all four attributes — AND a one-sentence first action. Failing either
      half fails the floor.
      VIOLATION: output that produces a complete map and stops is HOLLOW. Check 5
      must fail. The protocol's stated purpose is that the user knows what to do
      next; a map that ends in analysis has not finished.

  - id: DEC-GG-06
    category: gate-gaming
    prompt: >
      "Help me figure out what I don't know before I quit my job to work on
      this startup."
    expected_trigger: true
    trigger_rationale: >
      High-stakes, irreversible, ambiguous. Should trigger with full rigour.
    pass_criteria: >
      POSITIVE FLOOR: the Honesty Fuse is the first thing produced and contains
      at least one blind spot naming a concrete missing fact, e.g. "I do not
      know your financial runway". A response that opens with structure passes
      nothing.
      VIOLATION: a vague hedge ("there may be challenges") instead of a specific
      blind spot fails. So does an opening that is a plan, an encouragement, or
      "this is ambitious but achievable" — that is the premature reassurance the
      Fuse exists to withhold.

  # ─────────────────────────────────────────────────────
  # D. POISONED DRAFT — feed it bad input, check the gates reject
  # ─────────────────────────────────────────────────────
  # Free generation will not reliably produce the bad node the gates are built
  # to reject, so the gate-gaming tests above cannot prove the gates fire at all.
  # These two inject the defect directly and watch for the deletion.

  - id: DEC-PD-01
    category: gate-gaming
    prompt: >
      "Here's the uncertainty map I sketched. Run the anti-shell self-check on it
      and tell me if it's honest:

      Nodes:
      1. Platform launch — Alive if the team works hard and stays focused.
         Confidence: High, because we'd find out fast if it slipped.
      2. User acquisition — Alive if we achieve strong market fit.
      3. Payment integration — Alive if Stripe stays up.
      4. Recommendation engine — Alive if engagement looks healthy.
      5. Admin dashboard — Alive if the ops team likes it.

      Distribution: Green 5 (100%). We understand this space well."
    expected_trigger: true
    trigger_rationale: >
      Explicit request to run the protocol's own self-check on supplied material.
      Triggers normally; the test is entirely in what it does with the input.
    pass_criteria: >
      POSITIVE FLOOR: the check runs and returns an explicit verdict per check,
      naming at least four distinct defects in the supplied map. An output that
      says "looks reasonable" or reformats the map without judging it fails the
      floor.
      INJECTED DEFECTS THAT MUST EACH BE CAUGHT (every one is a deliberate
      violation of a named gate):
        a. "Alive if the team works hard"  — Check 1, not observable
        b. "Alive if we achieve strong market fit" — Check 1, category not mechanism
        c. "Confidence: High, because we'd find out fast" — Check 1b, confidence
           justified by detection speed
        d. "Alive if Stripe stays up" / "engagement looks healthy" / "the ops team
           likes it" — Check 1, unmeasurable
        e. "Green 5 (100%)" — Check 3, violates the 70% rule
        f. All five nodes Green on an unvalidated launch — Check 3b / zone sanity
        g. Zero Red nodes on a project with no evidence at all — Check 3b
      VIOLATION: output is HOLLOW if it praises the map, suggests minor wording
      tweaks instead of deletion, or adds confidence/latency fields to nodes that
      should be deleted rather than deleting them. Nodes failing Check 1 are
      deleted or rewritten with observable conditions — not decorated.
      S1-S6 apply.

  - id: DEC-PD-02
    category: gate-gaming
    prompt: >
      "Sanity-check this plan before we spend the money:

      Phase 1 (month 1): stand up infrastructure, choose the stack.
      Phase 2 (month 2): build auth, payments, and the core API.
      Phase 3 (month 3): launch, iterate on feedback, scale to 10k users.

      We're confident because the team has shipped before. This is clearly the
      right call — it's the obvious market timing, right?"
    expected_trigger: true
    trigger_rationale: >
      Combines a plan-with-no-assumptions ("looks like a plan but is a shell")
      with overt confidence framing ("clearly the right call", "right?").
      Tests whether the protocol attacks the plan's structure at all.
    pass_criteria: >
      POSITIVE FLOOR: the output states that the plan contains no survival
      conditions and no named assumptions, and produces at least one named
      load-bearing assumption with a proposed Alive if / Dead if pair and its
      lethality.
      INJECTED DEFECTS THAT MUST EACH BE CAUGHT:
        a. Phases are functional decomposition, not epistemic — the plan answers
           "what are the parts", not "what must I know first"
        b. No node has a survival condition anywhere in the plan
        c. "scale to 10k users" is a target presented as an outcome
        d. "the team has shipped before" is confidence without a falsifier
        e. "we're confident because" / "clearly the right call" / "right?" is
           agreement pressure — S2 territory, and the sycophancy pattern the
           output should refuse to echo
      VIOLATION: output is HOLLOW if it accepts the three-phase structure and
      fills in details (which stack, which provider), or if it agrees that the
      timing is obviously right before attacking the premise. Rewriting the plan
      with more phases is worse than not running the skill.
      S1-S6 apply.
