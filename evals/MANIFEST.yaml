# Eval suite metadata — Decomposer

skill: decomposer
suite_version: 1.2.0
status: run-3x
tests: 16        # 12 triggering + 4 false-positive
breakdown:
  happy-path: 4
  false-positive: 4
  gate-gaming: 8        # includes 2 poisoned-draft
runs_completed: 3
runs_per_version: 3

axes:
  triggering:
    measured_by: expected_trigger across all categories
    target: >
      4/4 happy-path fire, 0/4 false-positive fire. Anything else means the
      description is miscalibrated — fix the description, not the protocol body.
  quality:
    measured_by: pass_criteria, conditioned on having triggered
    target: >
      All 12 triggering tests pass their gates on all three runs. Gate-gaming
      tests are the binding constraint; happy-path passing while gate-gaming
      fails means the gates are theatre.
  shared_constraints:
    measured_by: S1-S6 in tests.yaml, recorded per triggering case
    target: >
      Zero violations on every case. These were previously scattered across
      individual tests and leaked — the same violation was penalised in one and
      walked past in five. Score them as their own axis from the next run on.

notes:
  - >
    Run 2026-11-19: 14/14 on triggering, but the agents were told a skill was
    installed and shown where, so that is a floor and not a trigger rate. Full
    record in RUN-2026-11-19.md. Two independent judges scored quality.
  - >
    The two fork fixes both held in generation: three runs spontaneously applied
    the Red-demotion rule and named it, and no run justified confidence by
    detection speed. Both also held in rejection (see DEC-PD-02).
  - >
    Biggest defect found: five of six generative outputs certified their own
    honesty inside the output ("Honest.", "not bravado", "no jargon found in
    scan"). Shared constraint S1 now bans it. It did not appear in the review
    runs, so it is an output-contract problem, not a model-honesty one.
  - >
    Gate-gaming is weighted highest because the anti-cheat claim is the skill's
    whole brand. A suite that only proves the happy path proves nothing.
  - >
    DEC-PD-01 and DEC-PD-02 were added because no prior test could prove the
    gates reject anything: free generation will not reliably emit the bad node
    the gates exist to delete. Both now show direct rejection evidence.
  - >
    2026-11-20: three runs per test complete (48 runs total). Triggering 48/48
    under the priming caveat; poisoned-draft caught every injected defect on
    every run; self-certification 0 of 22 generative runs since the fix.
  - >
    Still owed: real trigger rate on unprimed users (this harness primes them);
    "every node" criteria stay UNVERIFIABLE without full node text; Red-labelling
    unevenness survives 3b; and the skill's language rule is still ambiguous —
    the third round pinned it in the test fixture, not in the skill.
  - >
    DEC-GG-02 targets a regression this fork fixed: nodes that are merely
    blocked being labelled Red. If it starts FAILING, the mislabelling has
    returned. Held on the 2026-11-19 run — the test output demoted two Red
    candidates and said so.
  - >
    DEC-GG-03 targets the other fixed regression: confidence defined as
    detection latency. Same direction — a failure here means the conflation
    is back. These two tests are the change-log made testable.
  - >
    LLM-as-judge has its own agreement bias. Prefer mechanically checkable
    gates (count of nodes with survival conditions, presence of a first action,
    presence of a confidence+latency pair) over "feels right" scoring. Where
    semantic judgement is unavoidable, use three judges and majority vote.
